name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  preview:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils shellcheck shfmt
      - name: Make scripts executable
        run: chmod +x launcher/codex-ubuntu scripts/*.sh tests/*.sh tests/fixtures/*
      - name: Lint shell scripts
        run: make lint
      - name: Syntax checks
        run: make check
      - name: Smoke tests
        run: make test

  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils lintian
      - name: Make scripts executable
        run: chmod +x launcher/codex-ubuntu scripts/*.sh tests/*.sh tests/fixtures/*
      - name: Build Debian packages
        run: |
          make build-deb
          make build-electron-deb
      - name: Validate Debian packages
        run: |
          make package-smoke
          make electron-package-smoke
      - name: Install and remove Debian packages
        env:
          CODEX_UBUNTU_PACKAGE_INSTALL_TEST: "1"
        run: make package-install-smoke
