name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  preview:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils
      - name: Make scripts executable
        run: chmod +x launcher/codex-ubuntu scripts/*.sh tests/*.sh tests/fixtures/*
      - name: Syntax checks
        run: make check
      - name: Smoke tests
        run: make test

  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils lintian
      - name: Make scripts executable
        run: chmod +x launcher/codex-ubuntu scripts/*.sh tests/*.sh tests/fixtures/*
      - name: Build Debian package
        run: make build-deb
      - name: Validate Debian package
        run: make package-smoke
